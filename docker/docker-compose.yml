services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8888:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--global-response-templating"]
  service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
        wiremock:
          condition: service_healthy
    ports:
      - "8080:8080"
    command:
      - java
      - -Dsecret=qazWSXedc
      - -Dmock=http://wiremock:8080/
      - -jar
      - internal-0.0.1-SNAPSHOT.jar